<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Bóng Bàn Cổ Điển — game hai người</title>
  <desc id="desc">Đồ họa bàn chơi màu xanh đêm, hai vợt san hô và ngọc, một quả bóng sáng ở giữa.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ed"/><stop offset="1" stop-color="#e4ece3"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164650"/><stop offset=".56" stop-color="#0d2f3d"/><stop offset="1" stop-color="#12323c"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffad84"/><stop offset="1" stop-color="#ef735f"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3f0d7"/><stop offset="1" stop-color="#70cdb6"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="720" height="420" rx="32" fill="url(#paper)"/>
  <circle cx="112" cy="87" r="58" fill="#e7d5bd" opacity=".38"/>
  <circle cx="637" cy="344" r="74" fill="#d4e8df" opacity=".72"/>
  <text x="56" y="57" fill="#697d77" font-family="Calibri, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="3">HAI NGƯỜI · MỘT BÀN</text>
  <text x="54" y="111" fill="#17363c" font-family="Calibri, Inter, sans-serif" font-size="39" font-weight="700" letter-spacing="-.8">Bóng Bàn Cổ Điển</text>
  <text x="57" y="139" fill="#667b76" font-family="Calibri, Inter, sans-serif" font-size="15">Một cuộc đối đầu nhanh, ngay trên cùng màn hình</text>
  <rect x="46" y="168" width="628" height="210" rx="23" fill="#09242e" opacity=".22" filter="url(#shadow)"/>
  <rect x="45" y="158" width="630" height="218" rx="22" fill="#081e28"/>
  <rect x="57" y="170" width="606" height="194" rx="15" fill="url(#court)" stroke="#c7e4d5" stroke-opacity=".3" stroke-width="1.5"/>
  <path d="M72 183H648M72 351H648" stroke="#d2eadb" stroke-opacity=".07" stroke-width="1"/>
  <path d="M360 174V360" stroke="#d7eadc" stroke-opacity=".47" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="360" cy="267" r="30" fill="none" stroke="#d7eadc" stroke-opacity=".2" stroke-width="1.5"/>
  <text x="102" y="208" fill="#ef9a7e" font-family="Calibri, Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2">TRÁI</text>
  <text x="583" y="208" fill="#a3e8d5" font-family="Calibri, Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="2">PHẢI</text>
  <rect x="96" y="226" width="15" height="82" rx="7.5" fill="url(#coral)"/>
  <rect x="609" y="241" width="15" height="82" rx="7.5" fill="url(#mint)"/>
  <circle cx="421" cy="245" r="24" fill="#ffe5b8" opacity=".19"/>
  <circle cx="421" cy="245" r="9" fill="#fff1d2"/>
  <path d="M421 245C456 216 487 213 521 231" fill="none" stroke="#ffe5b8" stroke-opacity=".43" stroke-width="2" stroke-dasharray="3 7"/>
  <circle cx="422" cy="244" r="2.3" fill="#fff"/>
  <text x="55" y="405" fill="#72847d" font-family="Calibri, Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1">W / S</text>
  <text x="630" y="405" fill="#72847d" font-family="Calibri, Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="1" text-anchor="end">↑ / ↓</text>
</svg>
