    <g transform="translate(213 188) rotate(-3)"><rect width="93" height="132" rx="10" fill="#f5efdf"/><text x="13" y="31" fill="#263a43" font-family="Calibri,sans-serif" font-size="22" font-weight="700">7</text><text x="43" y="82" fill="#263a43" font-family="Georgia,serif" font-size="38">♣</text></g>
    <g transform="translate(322 188) rotate(3)"><rect width="93" height="132" rx="10" fill="#f5efdf"/><text x="13" y="31" fill="#ad4944" font-family="Calibri,sans-serif" font-size="22" font-weight="700">Q</text><text x="43" y="82" fill="#ad4944" font-family="Georgia,serif" font-size="38">♦</text></g>
