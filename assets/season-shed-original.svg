  <linearGradient id="winter"><stop stop-color="#e2eef3"/><stop offset="1" stop-color="#b9d4e1"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#102c27" flood-opacity=".32"/></filter>
