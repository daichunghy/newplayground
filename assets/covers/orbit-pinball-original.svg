<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Cú Sao Gác Đèn · pinball NewPlayground</title>
  <desc id="desc">Bàn pinball SVG vẽ nguyên bản với Cú Sao, sáu đèn mục tiêu, đường ray xanh ngọc và vòng đệm màu hổ phách.</desc>
  <defs>
    <linearGradient id="space" x2="0" y2="1"><stop stop-color="#09152d"/><stop offset="1" stop-color="#16234f"/></linearGradient>
    <linearGradient id="cabinet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#366c90"/><stop offset=".55" stop-color="#243970"/><stop offset="1" stop-color="#111d42"/></linearGradient>
    <linearGradient id="playfield" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#193e69"/><stop offset=".5" stop-color="#192b5c"/><stop offset="1" stop-color="#322451"/></linearGradient>
    <radialGradient id="bumper"><stop stop-color="#fff5c8"/><stop offset=".32" stop-color="#f8c86c"/><stop offset=".73" stop-color="#e68160"/><stop offset="1" stop-color="#873f67"/></radialGradient>
    <radialGradient id="shine"><stop stop-color="#86f8eb" stop-opacity=".65"/><stop offset="1" stop-color="#67daf0" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
