  <rect x="48" y="708" width="504" height="64" rx="22" fill="#fff8e5" opacity=".9"/>
  <text x="300" y="735" text-anchor="middle" font-family="Calibri, Inter, sans-serif" font-size="17" font-weight="800" letter-spacing="3" fill="#6a8470">VUỐT DÂY · NHẶT SAO</text>
  <text x="300" y="763" text-anchor="middle" font-family="Calibri, Inter, sans-serif" font-size="29" font-weight="900" fill="#514f80">MẦM MĂM</text>
</svg>
