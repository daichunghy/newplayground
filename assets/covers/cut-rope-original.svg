    <path d="M0-70v-29" stroke="#547968" stroke-width="8" stroke-linecap="round"/>
    <path d="M0-92q-48-42-51-2 26 26 51 2z" fill="url(#sprout)" stroke="#436c65" stroke-width="6"/>
    <path d="M2-94q43-45 54-8-21 31-54 8z" fill="url(#sprout)" stroke="#436c65" stroke-width="6"/>
    <path d="M-33 47Q-57 10-43-34q9-37 40-39 36-1 48 36 15 44-4 81-22 36-51 19-14-8-23-16z" fill="url(#mamm)" stroke="#50537e" stroke-width="8"/>
    <path d="M-36-21Q-26-46-7-46q27-4 48 16Q21-8 1-7q-24 0-37-14z" fill="#b7a8d3" stroke="#50537e" stroke-width="7" stroke-linejoin="round"/>
    <ellipse cy="-25" rx="27" ry="12" fill="#343e5d"/>
    <path d="M-15-25q15-13 30 0-15 13-30 0z" fill="#f0a1a0"/>
    <ellipse cx="12" cy="3" rx="8" ry="11" fill="#f3edce"/><circle cx="14" cy="5" r="3.5" fill="#313b60"/>
    <path d="M-18 1q6 5 12 0m-17 13q5 4 10 0" fill="none" stroke="#d4a6d1" stroke-width="5" stroke-linecap="round"/>
    <path d="M-20 57q-18 23-39 14 9-23 39-14zM14 59q19 20 38 8-11-22-38-8z" fill="#9dcc91" stroke="#547968" stroke-width="4"/>
