<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Phá Gạch</title>
  <desc id="desc">A luminous ball arcs above an original abstract array of colored bricks and a blue paddle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b38"/><stop offset=".58" stop-color="#18305a"/><stop offset="1" stop-color="#29264b"/></linearGradient>
    <linearGradient id="brickA" x2="0" y2="1"><stop stop-color="#fff0a4"/><stop offset=".26" stop-color="#fb7185"/><stop offset="1" stop-color="#783c83"/></linearGradient>
    <linearGradient id="brickB" x2="0" y2="1"><stop stop-color="#fff4a8"/><stop offset=".25" stop-color="#38bdf8"/><stop offset="1" stop-color="#355eb6"/></linearGradient>
    <linearGradient id="brickC" x2="0" y2="1"><stop stop-color="#fff7bd"/><stop offset=".24" stop-color="#4ade80"/><stop offset="1" stop-color="#267a83"/></linearGradient>
    <linearGradient id="pad" x2="0" y2="1"><stop stop-color="#e7fcff"/><stop offset=".36" stop-color="#72e0f0"/><stop offset="1" stop-color="#4781df"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#fff"/><stop offset=".36" stop-color="#fff4bf"/><stop offset="1" stop-color="#ffa841" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="480" rx="28" fill="url(#bg)"/>
  <g stroke="#c9e2ff" stroke-opacity=".08" stroke-width="1">
    <path d="M48 0v480M96 0v480M144 0v480M192 0v480M240 0v480M288 0v480M336 0v480M384 0v480M432 0v480M480 0v480M528 0v480M576 0v480M624 0v480M672 0v480"/>
    <path d="M0 48h720M0 96h720M0 144h720M0 192h720M0 240h720M0 288h720M0 336h720M0 384h720M0 432h720"/>
  </g>
  <g opacity=".96" filter="url(#glow)">
    <g fill="url(#brickA)"><rect x="72" y="72" width="82" height="25" rx="7"/><rect x="162" y="72" width="82" height="25" rx="7"/><rect x="252" y="72" width="82" height="25" rx="7"/><rect x="342" y="72" width="82" height="25" rx="7"/><rect x="432" y="72" width="82" height="25" rx="7"/><rect x="522" y="72" width="82" height="25" rx="7"/></g>
    <g fill="url(#brickB)"><rect x="117" y="108" width="82" height="25" rx="7"/><rect x="207" y="108" width="82" height="25" rx="7"/><rect x="297" y="108" width="82" height="25" rx="7"/><rect x="387" y="108" width="82" height="25" rx="7"/><rect x="477" y="108" width="82" height="25" rx="7"/></g>
    <g fill="url(#brickC)"><rect x="72" y="144" width="82" height="25" rx="7"/><rect x="162" y="144" width="82" height="25" rx="7"/><rect x="252" y="144" width="82" height="25" rx="7"/><rect x="342" y="144" width="82" height="25" rx="7"/><rect x="432" y="144" width="82" height="25" rx="7"/><rect x="522" y="144" width="82" height="25" rx="7"/></g>
  </g>
  <path d="M192 355Q270 247 370 251T516 217" fill="none" stroke="#f9d991" stroke-opacity=".58" stroke-width="3" stroke-dasharray="7 13"/>
  <circle cx="516" cy="217" r="34" fill="url(#orb)" filter="url(#glow)"/><circle cx="516" cy="217" r="10" fill="#fff5c9"/>
  <rect x="273" y="383" width="174" height="24" rx="12" fill="url(#pad)" filter="url(#glow)"/>
  <path d="M78 432h564" stroke="#c3d9ff" stroke-opacity=".3"/>
  <text x="360" y="456" fill="#edf4ff" text-anchor="middle" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2">PHÁ GẠCH</text>
