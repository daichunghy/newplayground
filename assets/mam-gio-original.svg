    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#536e5c"/><stop offset="1" stop-color="#243d45"/></linearGradient>
    <radialGradient id="bubble" cx="34%" cy="27%"><stop stop-color="#fffdf0" stop-opacity=".98"/><stop offset=".38" stop-color="#d5f5db" stop-opacity=".75"/><stop offset=".78" stop-color="#79c8ca" stop-opacity=".27"/><stop offset="1" stop-color="#fff2cf" stop-opacity=".08"/></radialGradient>
    <linearGradient id="leaf" x2="0" y2="1"><stop stop-color="#b9dca0"/><stop offset="1" stop-color="#6c9b7c"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <circle cx="948" cy="120" r="90" fill="#fff0bd" opacity=".42" filter="url(#soft)"/>
  <circle cx="948" cy="120" r="37" fill="#fff3c7"/>
