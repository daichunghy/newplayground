<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Mầm Gió, artwork gốc</title>
  <desc id="desc">Hạt gió nhỏ nhảy giữa những bậc lá và bẫy sinh vật mực rêu trong các bong bóng sáng.</desc>
  <defs>
