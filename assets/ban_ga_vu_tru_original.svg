<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Tuyến Sáng — original space arcade art</title>
  <desc id="desc">A small teal geometric ship faces glowing angular light forms across a dark blue starfield.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#101b33"/><stop offset=".65" stop-color="#1a3043"/><stop offset="1" stop-color="#273a4b"/></linearGradient>
    <radialGradient id="mist"><stop stop-color="#65c7bd" stop-opacity=".26"/><stop offset="1" stop-color="#65c7bd" stop-opacity="0"/></radialGradient>
    <linearGradient id="ship" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e2fff0"/><stop offset=".52" stop-color="#75d8c9"/><stop offset="1" stop-color="#369dad"/></linearGradient>
    <linearGradient id="stone" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffe4ae"/><stop offset="1" stop-color="#cb755f"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="440" rx="28" fill="url(#sky)"/>
  <ellipse cx="369" cy="154" rx="302" ry="200" fill="url(#mist)"/>
  <g fill="#e8f5e7" opacity=".75"><circle cx="75" cy="77" r="2"/><circle cx="171" cy="134" r="1.5"/><circle cx="643" cy="81" r="2"/><circle cx="593" cy="201" r="1.4"/><circle cx="222" cy="51" r="1.4"/><circle cx="421" cy="92" r="1.2"/><circle cx="508" cy="342" r="1.8"/><circle cx="106" cy="296" r="1.6"/><circle cx="318" cy="263" r="1.3"/></g>
  <g opacity=".2" fill="none" stroke="#b7e2d8" stroke-width="2"><path d="M38 184h64m500 0h81M54 235h92m438 0h86M35 282h72m510 0h62"/><path d="M90 116c112 24 180-21 288-1s185 41 256 13"/></g>
  <g filter="url(#glow)" stroke="#ffd3a1" stroke-width="2">
