    <path d="m-9-15 9-20 9 20-3 22h-12z" fill="#1e3b4d"/>
    <path d="M-7 23 0 51l7-28" fill="#ffc280" opacity=".9"/>
  </g>
  <path d="M54 387h612" stroke="#97dfd1" stroke-opacity=".28" stroke-width="2"/>
  <text x="360" y="417" fill="#a9ddd2" font-family="Calibri,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">TUYẾN SÁNG</text>
