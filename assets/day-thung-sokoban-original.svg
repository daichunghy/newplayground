<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Original box-pushing puzzle cover</title>
  <desc id="desc">A small warehouse grid with a person guiding two wooden crates toward glowing floor targets.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f7f2df"/><stop offset="1" stop-color="#e8e6d3"/></linearGradient>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#78907d"/><stop offset="1" stop-color="#4f6a58"/></linearGradient>
    <linearGradient id="wood" x2="1" y2="1"><stop stop-color="#d99f64"/><stop offset="1" stop-color="#a86435"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#fff1bd"/><stop offset=".5" stop-color="#f1be63"/><stop offset="1" stop-color="#e29d46" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#273b30" flood-opacity=".2"/></filter>
  </defs>
  <rect width="640" height="400" rx="30" fill="url(#paper)"/>
  <circle cx="536" cy="76" r="56" fill="#fffdf4" opacity=".62"/>
  <g transform="translate(100 58)" filter="url(#shadow)">
