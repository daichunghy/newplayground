    <g transform="translate(12 12)">
      <rect width="416" height="258" rx="13" fill="#d7dfd0"/>
      <g fill="url(#wall)" stroke="#91a28e" stroke-width="2">
        <rect x="0" y="0" width="52" height="52"/><rect x="52" y="0" width="52" height="52"/><rect x="104" y="0" width="52" height="52"/><rect x="156" y="0" width="52" height="52"/><rect x="208" y="0" width="52" height="52"/><rect x="260" y="0" width="52" height="52"/><rect x="312" y="0" width="52" height="52"/><rect x="364" y="0" width="52" height="52"/>
        <rect x="0" y="52" width="52" height="52"/><rect x="364" y="52" width="52" height="52"/>
        <rect x="0" y="104" width="52" height="52"/><rect x="364" y="104" width="52" height="52"/>
        <rect x="0" y="156" width="52" height="52"/><rect x="364" y="156" width="52" height="52"/>
        <rect x="0" y="208" width="52" height="50"/><rect x="52" y="208" width="52" height="50"/><rect x="104" y="208" width="52" height="50"/><rect x="156" y="208" width="52" height="50"/><rect x="208" y="208" width="52" height="50"/><rect x="260" y="208" width="52" height="50"/><rect x="312" y="208" width="52" height="50"/><rect x="364" y="208" width="52" height="50"/>
      </g>
      <g fill="url(#glow)">
        <circle cx="130" cy="130" r="36"/><circle cx="286" cy="130" r="36"/>
      </g>
      <g fill="none" stroke="#d58c37" stroke-width="5">
        <circle cx="130" cy="130" r="15"/><circle cx="286" cy="130" r="15"/>
      </g>
      <g stroke="#7c4b2b" stroke-width="4" stroke-linejoin="round" fill="url(#wood)">
