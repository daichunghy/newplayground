name: Apply reviewed desktop depth patch

on:
  pull_request:
    paths:
      - '.github/desktop-reviewed.patch'
      - '.github/workflows/desktop-depth-integration.yml'

# Temporary job restricted to the existing same-repository review branch.
# Commits only reviewed source/test files after browser checks; never deploys.
permissions:
  contents: write

concurrency:
  group: desktop-depth-reviewed-patch
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.pull_request.number == 11 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/comfortable-arcade-redesign-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_BRANCH: codex/comfortable-arcade-redesign-20261018
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only reviewed source changes
        run: |
          git apply --check .github/desktop-reviewed.patch
          git apply .github/desktop-reviewed.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          anchor = '  <script src="scripts/arcade-desktop.js?v=20261018_depth1" defer></script>'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '\n  <script src="scripts/arcade-stall-scene.js?v=20261018_depth2" defer></script>')
          p.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 4
          git diff --name-only | sort > /tmp/changed-paths
          printf '%s\n' index.html scripts/arcade-desktop-qa.cjs scripts/arcade-desktop.js scripts/engines.js | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/changed-paths
      - name: Verify syntax and all model regressions
        run: |
          set -o pipefail
          mkdir -p /tmp/arcade-review
          for file in app.js games-data.js scripts/*.js scripts/arcade-*.cjs; do node --check "$file"; done
          node --test tests/*.test.cjs | tee /tmp/arcade-review/node-tests.txt
      - name: Install development-only Chromium
        run: |
          npm install --prefix /tmp/arcade-tools --no-save --package-lock=false playwright@1.56.1
          node /tmp/arcade-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify existing games and 300 launch-close sessions
        env:
          NODE_PATH: /tmp/arcade-tools/node_modules
        run: node scripts/arcade-browser-qa.cjs
      - name: Verify new desktop gameplay and screenshots
        if: success() || failure()
        env:
          NODE_PATH: /tmp/arcade-tools/node_modules
        run: node scripts/arcade-desktop-qa.cjs
      - name: Commit tested patch without forcing or deploying
        if: success()
        run: |
          CURRENT_HEAD=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$CURRENT_HEAD" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/engines.js scripts/arcade-desktop.js scripts/arcade-desktop-qa.cjs
          git commit -m 'fix: verify direct scene serving, card drop areas and desktop gameplay'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > /tmp/arcade-review/tested-checkout.txt
      - name: Package exact reviewed worktree
        if: always()
        run: |
          mkdir -p /tmp/arcade-review
          git diff > /tmp/arcade-review/uncommitted-review.patch
          tar --exclude='./.git' -czf /tmp/arcade-review/newplayground-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-depth-integration-review
          path: /tmp/arcade-review/
          retention-days: 7
